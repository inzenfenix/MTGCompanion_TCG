apply plugin: 'com.android.application'

android {
    namespace = "com.udd.mtgcompanion"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.udd.mtgcompanion"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // ROADMAP.md M2 — without this, each environment that has never built
    // debug Android before (a fresh GitHub Actions runner, or anyone's
    // brand-new dev machine) falls back to the Android Gradle Plugin's
    // default behavior: auto-generate a throwaway ~/.android/debug.keystore
    // with a RANDOM key, different every time. Real symptom this caused,
    // live: the CI-built APK built and ran fine, but refused to INSTALL on
    // a phone that already had a locally-built (Drive-shared) debug APK —
    // Android requires a matching signing certificate to update an already-
    // installed app, and the two builds' auto-generated keystores never
    // matched, on top of not even matching each other between separate CI
    // runs. Fix: a single, checked-in debug keystore (`debug.keystore`,
    // this repo's actual dev machine's own keystore, not a fresh one) used
    // by every build path — local (desktop-runner's rebuildApk()) and CI
    // (build-apk.yml) alike — so they always produce byte-identical
    // signatures and any of them can update over any other. Debug keys are
    // not sensitive (they can't sign anything installable outside of
    // "Unknown sources" sideloading, and Google's own default debug
    // alias/password below are publicly documented) — this is standard
    // practice for exactly this class of CI-vs-local signature mismatch,
    // distinct from the still-open "real release signing" follow-up
    // (workstream C) which is about a PRODUCTION keystore, not this one.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Only capacitor-android depends on this (as `implementation`, so it's
    // NOT exposed to app's own compile classpath) — declared directly here
    // too so MainActivity.java can call WebSettingsCompat itself. See its
    // own comment for why.
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
