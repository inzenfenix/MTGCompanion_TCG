      const slideIn = (sel, at) => tl.fromTo(sel, { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.7, ease: IN }, at);
      const mon = (sel, at, until) => {
        tl.fromTo(sel, { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.5, ease: IN, immediateRender: false }, at - 0.1);
        tl.to(sel, { opacity: 0, scale: 0.97, duration: 0.3, ease: OUT }, until - 0.35);
      };

      // rótulo
      tl.fromTo('#s09-name .bar', { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: IN }, T.name);
      tl.fromTo('#s09-name .n', { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.7, ease: IN }, T.name + 0.2);
      show('#s09-name .r', T.name + 0.6, 0.3);
      out('#s09-name > *', T.card - 0.2);

      // carta
      tl.fromTo('#s09-card', { x: 140, y: -1000, rotationZ: -14, rotationY: 180 }, { x: 0, y: 0, rotationZ: -3, duration: 1.3, ease: IN }, T.card);
      tl.fromTo('#s09-card', { rotationY: 180 }, { rotationY: 0, duration: 1.1, ease: MOVE, immediateRender: false }, T.card + 1.0);
      tl.to('#s09-card', { x: -560, y: 40, scale: 0.62, rotationZ: -6, duration: 0.8, ease: MOVE }, T.rig - 0.3);

      // derechos
      blurIn('#s09-rw1', T.rig + 0.3); blurIn('#s09-rw2', T.rig + 2.2);
      show('#s09-a-h', T.rig + 4.6, 0.3);
      ['#s09-a1', '#s09-a2', '#s09-a3'].forEach((s, i) => tl.fromTo(s, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.6, ease: IN }, T.rig + 5.4 + i * 1.3));
      out('#s09-rig > *', T.life - 0.4);

      // ciclo de vida: el riel avanza y cada etapa se enciende
      blurIn('#s09-l-t', T.life + 0.1);
      tl.fromTo('#s09-rail', { scaleX: 0 }, { scaleX: 1, duration: 2.4, ease: MOVE }, T.life + 0.6);
      ['#s09-n1', '#s09-n2', '#s09-n3', '#s09-n4', '#s09-n5'].forEach((s, i) => {
        tl.fromTo(s, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, T.life + 0.5 + i * 0.5);
        tl.fromTo(s, { borderColor: '#6b5a3a' }, { borderColor: '#d4af37', duration: 0.25, immediateRender: false }, T.life + 0.9 + i * 0.5);
      });
      show('#s09-l-due', T.life + 1.4, 0.3);
      show('#s09-l-out', T.life + 3.2, 0.3);
      slideIn('#s09-l-real', T.life + 4.2);
      show('#s09-l-real2', T.life + 4.8, 0.3);
      out('#s09-life > *', T.step - 0.4);

      // step-up: lo de bajo riesgo pasa; lo de alto riesgo choca con la contraseña
      blurIn('#s09-s-t', T.step + 0.1);
      slideIn('#s09-s-a', T.step + 0.8); show('#s09-s-a2', T.step + 1.6, 0.3);
      ['#s09-s-b1', '#s09-s-b2', '#s09-s-b3'].forEach((s, i) => slideIn(s, T.step + 3.4 + i * 0.4));
      tl.fromTo('#s09-lock', { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.6, ease: IN }, T.step + 6.6);
      blurIn('#s09-s-j', T.step + 10.6);
      blurIn('#s09-s-k', T.step + 12.6);
      out('#s09-step > *', T.monA - 0.45);
      mon('#s09-pmon', T.monA, T.json);

      // exportación
      slideIn('#s09-j-f', T.json);
      tl.fromTo('#s09-keys .s09-key', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: IN, stagger: 0.06 }, T.json + 0.8);
      show('#s09-j-nh', T.json + 2.4, 0.25);
      ['#s09-j-n1', '#s09-j-n2', '#s09-j-n3', '#s09-j-n4'].forEach((s, i) => show(s, T.json + 2.8 + i * 0.35, 0.25));
      out('#s09-json > *', T.monB - 0.45);
      mon('#s09-mon', T.monB, T.mail);

      // correo
      slideIn('#s09-m-old', T.mail);
      show('#s09-m-arr', T.mail + 0.6, 0.2);
      tl.fromTo('#s09-m-new', { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.6, ease: IN }, T.mail + 0.7);
      blurIn('#s09-m-ses', T.mail + 1.4);
      tl.fromTo('#s09-mail', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: IN }, T.mail + 2.0);
      out('#s09-mailc > *', T.monC - 0.45);
      mon('#s09-mon', T.monC, T.del);

      // supresión denegada
      slideIn('#s09-d-req', T.del);
      tl.fromTo('#s09-d-srv', { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.6, ease: IN }, T.del + 0.4);
      tl.fromTo('#s09-d-led', { backgroundColor: '#3fbf6a' }, { backgroundColor: '#ff5a4f', duration: 0.2 }, T.del + 1.3);
      show('#s09-d-srv .req', T.del + 1.4, 0.2);
      show('#s09-d-why', T.del + 2.0, 0.3);
      blurIn('#s09-d-t', T.del + 3.6);
      out('#s09-del > *', T.monD - 0.45);
      mon('#s09-pmon', T.monD, T.keep);

      // qué se borra y qué se conserva
      blurIn('#s09-k-t', T.keep + 0.1);
      ['#s09-k-g1', '#s09-k-g2', '#s09-k-g3'].forEach((s, i) => {
        show(s, T.keep + 0.6 + i * 0.2, 0.25);
        tl.fromTo(`${s} .strike`, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: 'power2.out' }, T.keep + 1.6 + i * 0.2);
        tl.to(s, { color: '#8a7a66', duration: 0.3 }, T.keep + 1.7 + i * 0.2);
      });
      tl.fromTo('#s09-k-tx', { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.7, ease: IN }, T.keep + 2.8);
      show('#s09-k-yrs', T.keep + 3.6, 0.3);
      blurIn('#s09-k-s', T.keep + 4.8);
      show('#s09-k-s2', T.keep + 5.6, 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines['s09'] = tl;
    })();
  </script>
</template>
