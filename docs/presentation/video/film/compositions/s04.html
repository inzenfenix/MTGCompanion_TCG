        const out = [];

          const walk = (node) => [...node.childNodes].forEach((n) => {

              const frag = document.createDocumentFragment();
              for (const c of n.textContent) { const s = document.createElement('span'); s.textContent = c; frag.appendChild(s); out.push(s); }

        });

      out('#s04-pw > *', T.loc - 0.4);

      // cifrado
      slideIn('#s04-loc-slip', T.loc);
      tl.fromTo('#s04-loc-cut', { color: '#2a2018' }, { color: '#b3261e', duration: 0.2 }, T.loc + 1.1);
      tl.to('#s04-loc-cut', { opacity: 0, duration: 0.35, ease: OUT }, T.loc + 1.6);
      show('#s04-loc-km', T.loc + 1.9, 0.3);
      tl.fromTo(locChars, { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 0.022, ease: 'none' }, T.loc + 2.7);
      ['#s04-loc-l1', '#s04-loc-l2', '#s04-loc-l3', '#s04-loc-l4'].forEach((s, i) => show(s, T.loc + 4.0 + i * 0.5));
      tl.fromTo('#s04-c1', { color: '#f2e3cd' }, { color: '#d4af37', duration: 0.25 }, T.loc + 4.0);
      tl.fromTo('#s04-c3', { color: '#f2e3cd' }, { color: '#e9c98a', duration: 0.25 }, T.loc + 5.0);
      blurIn('#s04-loc-tech', T.loc + 5.8); show('#s04-loc-sub', T.loc + 6.2, 0.3);
      out('#s04-loc > *', T.tok - 0.4);

      // tokenización: la tarjeta entra a la bóveda y sale solo la referencia
      slideIn('#s04-tok-slip', T.tok);
      tl.fromTo('#s04-vault', { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.6, ease: IN }, T.tok + 0.3);
      tl.to('#s04-tok-slip', { x: 760, scale: 0.4, opacity: 0, duration: 0.9, ease: 'power3.in' }, T.tok + 1.3);
      tl.fromTo('#s04-dial', { rotation: 0, transformOrigin: '150px 150px' }, { rotation: 300, duration: 0.9, ease: MOVE }, T.tok + 2.1);
      tl.fromTo('#s04-tok-ref', { opacity: 0, x: 500, scale: 0.6 }, { opacity: 1, x: 0, scale: 1, duration: 0.8, ease: IN }, T.tok + 2.9);
      blurIn('#s04-tok-tech', T.tok + 3.4); show('#s04-tok-sub', T.tok + 3.8, 0.3);
      out('#s04-tok > *', T.sig - 0.4);

      // firma: el sello cae sobre cada pieza
      tl.fromTo(['#s04-sig-a', '#s04-sig-b'], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: IN, stagger: 0.15 }, T.sig);
      tl.fromTo('#s04-seal-a', { opacity: 0, scale: 1.8, rotation: -25 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.4, ease: 'back.out(1.3)' }, T.sig + 1.0);
      tl.fromTo('#s04-seal-b', { opacity: 0, scale: 1.8, rotation: 25 }, { opacity: 1, scale: 1, rotation: 8, duration: 0.4, ease: 'back.out(1.3)' }, T.sig + 1.5);
      blurIn('#s04-sig-tech', T.sig + 2.2); show('#s04-sig-sub', T.sig + 2.6, 0.3);
      out('#s04-sig > *', T.monA - 0.5);

      // prueba A: hash y v1 en la base real
      mon(T.monA, T.tam);

      // alteración
      slideIn('#s04-tam-slip', T.tam);
      show('#s04-tam-v', T.tam + 0.3, 0.3);
      tl.fromTo('#s04-tam-new', { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.35, ease: IN }, T.tam + 1.0);
      tl.fromTo('#s04-tam-old', { opacity: 1 }, { opacity: 0, duration: 0.2 }, T.tam + 1.0);
      show('#s04-tam-lab', T.tam + 1.3);
      tl.fromTo('#s04-srv', { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.6, ease: IN }, T.tam + 1.5);
      tl.fromTo('#s04-led', { backgroundColor: '#3fbf6a' }, { backgroundColor: '#ff5a4f', duration: 0.15 }, T.tam + 2.4);
      tl.fromTo('#s04-stamp', { opacity: 0, scale: 1.6, rotation: -10 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.35, ease: 'back.out(1.3)' }, T.tam + 2.6);
      out('#s04-tam > *', T.monB - 0.45);

      // prueba B: la alteración real y el 500
      mon(T.monB, T.key);

      // llaves: base y bóveda separadas, conteo del historial
      tl.fromTo('#s04-db', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: IN }, T.key);
      tl.fromTo('#s04-sm', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: IN }, T.key + 0.3);
      tl.fromTo('#s04-keyicon', { rotation: -40, transformOrigin: '150px 150px' }, { rotation: 0, duration: 0.8, ease: IN }, T.key + 0.6);
      tl.fromTo('#s04-gap', { opacity: 0, scaleX: 0, transformOrigin: 'left center' }, { opacity: 1, scaleX: 1, duration: 0.6, ease: IN }, T.key + 1.4);
      show('#s04-gap-lab', T.key + 1.9);
      show(['#s04-count-lab', '#s04-count'], T.key + 3.6, 0.3);
      const counter = { n: 0 };
      tl.fromTo(counter, { n: 0 }, { n: 205, duration: 1.6, ease: 'power2.out', onUpdate: () => { document.getElementById('s04-count-n').textContent = Math.round(counter.n); } }, T.key + 3.8);
      out('#s04-key > *', T.monC - 0.45);

      // prueba C: gitleaks limpio y el backend que no arranca sin llave
      mon(T.monC, T.next);

      // relevo
      tl.fromTo('#s04-next', { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.2, ease: 'none' }, T.next + 0.1);

      window.__timelines = window.__timelines || {};
      window.__timelines['s04'] = tl;
    })();
  </script>
</template>
