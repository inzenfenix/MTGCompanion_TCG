      // Inicio de cada tramo (s). Ajustar con la voz de Vicente; los data-start de arriba coinciden.

      // caracteres del hash, uno por span, antes de registrar el timeline
      const hashEl = document.getElementById('s08-h-out');
      const txt = hashEl.textContent; hashEl.textContent = '';
      const hashChars = [];
      for (const c of txt) { const s = document.createElement('span'); s.textContent = c; hashEl.appendChild(s); hashChars.push(s); }

      const tl = gsap.timeline({ paused: true });
      const IN = 'expo.out', MOVE = 'power2.inOut', OUT = 'power3.in';
      const show = (sel, at, d = 0.25) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d }, at);
      const out = (sel, at) => tl.to(sel, { opacity: 0, filter: 'blur(8px)', duration: 0.3, ease: OUT }, at);
      const blurIn = (sel, at) => tl.fromTo(sel, { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.18, ease: 'none' }, at);
      const slideIn = (sel, at) => tl.fromTo(sel, { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.7, ease: IN }, at);
      const mon = (sel, at, until) => {
        tl.fromTo(sel, { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.5, ease: IN, immediateRender: false }, at - 0.1);
        tl.to(sel, { opacity: 0, scale: 0.97, duration: 0.3, ease: OUT }, until - 0.35);
      };

      // carta
      tl.fromTo('#s08-card', { x: 140, y: -1000, rotationZ: -14, rotationY: 180 }, { x: 0, y: 0, rotationZ: -3, duration: 1.3, ease: IN }, T.card);
      tl.fromTo('#s08-card', { rotationY: 180 }, { rotationY: 0, duration: 1.1, ease: MOVE, immediateRender: false }, T.card + 1.0);
      tl.to('#s08-card', { x: -560, y: 40, scale: 0.62, rotationZ: -6, duration: 0.8, ease: MOVE }, T.req - 0.3);

      // requisitos: una palabra por beat de la voz
      ['#s08-q1', '#s08-q2', '#s08-q3', '#s08-q4'].forEach((s, i) => blurIn(s, T.req + 1.0 + i * 1.1));
      show('#s08-q5', T.req + 5.6, 0.3);
      out('#s08-req > *', T.pur - 0.4);

      // finalidades
      ['#s08-p1', '#s08-p2', '#s08-p3'].forEach((s, i) => tl.fromTo(s, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: IN }, T.pur + 0.3 + i * 0.5));
      tl.fromTo('#s08-pur .v', { opacity: 0 }, { opacity: 1, duration: 0.25, stagger: 0.15 }, T.pur + 2.6);
      blurIn('#s08-p-t', T.pur + 3.6);
      out('#s08-pur > *', T.hash - 0.4);

      // hash del texto → historial → la BD rechaza editarlo
      slideIn('#s08-h-in', T.hash);
      tl.fromTo(['#s08-h-box', '#s08-h-box-t'], { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.6, ease: IN }, T.hash + 0.5);
      tl.fromTo(hashChars, { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 0.022, ease: 'none' }, T.hash + 1.3);
      tl.fromTo('#s08-ledger', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: IN }, T.hash + 2.6);
      show('#s08-h-r1', T.hash + 3.2); show('#s08-h-r2', T.hash + 3.6);
      show('#s08-h-upd', T.hash + 5.0, 0.2);
      tl.fromTo('#s08-ledger', { x: 0 }, { keyframes: { x: [0, -10, 9, -6, 4, 0] }, duration: 0.4, ease: 'none', immediateRender: false }, T.hash + 5.1);
      show('#s08-h-trg', T.hash + 5.8, 0.3);
      out('#s08-hash > *', T.pre - 0.4);

      // nada pre-marcado: se activa una y las otras siguen apagadas
      ['#s08-x1', '#s08-x2', '#s08-x3'].forEach((s, i) => show(s, T.pre + i * 0.08, 0.3));
      tl.fromTo('#s08-x1-k', { x: 0 }, { x: 42, duration: 0.35, ease: MOVE }, T.pre + 1.0);
      tl.fromTo('#s08-x1-tg', { backgroundColor: '#5a4a3a' }, { backgroundColor: '#d4af37', duration: 0.35 }, T.pre + 1.0);
      blurIn('#s08-x-t', T.pre + 0.4);
      show('#s08-x-s', T.pre + 1.6, 0.3);
      out('#s08-pre > *', T.chk - 0.4);

      // compuerta
      slideIn('#s08-c-req', T.chk);
      tl.fromTo('#s08-gate', { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.6, ease: IN }, T.chk + 0.8);
      tl.fromTo('#s08-c-req', { y: 0 }, { y: 220, x: 300, scale: 0.6, opacity: 0, duration: 0.7, ease: 'power3.in', immediateRender: false }, T.chk + 2.4);
      show('#s08-c-yes', T.chk + 3.2, 0.3);
      show('#s08-c-no', T.chk + 3.8, 0.3);
      blurIn('#s08-c-s', T.chk + 4.6);
      out('#s08-chk > *', T.monA - 0.45);
