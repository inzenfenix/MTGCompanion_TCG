      const slideIn = (sel, at) => tl.fromTo(sel, { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.7, ease: IN }, at);

        tl.fromTo('#s07-mon', { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.5, ease: IN, immediateRender: false }, at - 0.1);

      tl.fromTo('#s07-spec', { opacity: 0, y: -50, scale: 1.08 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: 'back.out(1.3)' }, T.mat + 7.0);
      blurIn('#s07-spec-l', T.mat + 8.4);

      ['#s07-g1', '#s07-g2', '#s07-g3'].forEach((s, i) => {

      blurIn('#s07-g-fix', T.gap + 8.6);
      out('#s07-gap > *', T.deny - 0.4);

      // compra ajena: la petición choca con el servidor y la luz se pone roja

      show('#s07-d-srv .req', T.deny + 1.4, 0.2);
      blurIn('#s07-d-t', T.deny + 2.2);
      out('#s07-deny > *', T.monA - 0.45);
      mon(T.monA, T.sup);

      // soporte: sin motivo → 400; con motivo → 200 y fila en la auditoría
      slideIn('#s07-s-a', T.sup);
      show('#s07-s-a-r', T.sup + 1.0, 0.2);
      tl.fromTo('#s07-s-b', { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.7, ease: IN }, T.sup + 2.4);

      show('#s07-s-b-r', T.sup + 4.0, 0.2);
      tl.fromTo('#s07-ledger', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: IN }, T.sup + 5.0);
      show('#s07-s-row', T.sup + 5.7, 0.3);
      blurIn('#s07-s-note', T.sup + 6.6);
      out('#s07-sup > *', T.monB - 0.45);
      mon(T.monB, T.adm);

      // administrador
      ['#s07-e1', '#s07-e2', '#s07-e3', '#s07-e4'].forEach((s, i) => slideIn(s, T.adm + i * 0.08));
      tl.fromTo('#s07-p-req', { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.7, ease: IN }, T.adm + 2.2);
      show('#s07-p-body', T.adm + 2.6, 0.2);
      show('#s07-p-res', T.adm + 3.4, 0.2);
      show('#s07-p-sub', T.adm + 3.9, 0.3);
