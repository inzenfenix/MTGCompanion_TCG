  <script>
    (function () {
      // Inicio de cada tramo (s). Ajustar con la voz de Tomás Solano; los data-start de arriba coinciden.
      const T = { card: 0.1, scan: 4.5, baz: 20.95, monA1: 32.1, monA2: 37.7, qr: 44.9, monB: 51.02, map: 56.22 };

      const tl = gsap.timeline({ paused: true });
      const IN = 'expo.out', MOVE = 'power2.inOut', OUT = 'power3.in';
      const show = (sel, at, d = 0.25) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d }, at);
      const out = (sel, at) => tl.to(sel, { opacity: 0, filter: 'blur(8px)', duration: 0.3, ease: OUT }, at);
      const blurIn = (sel, at) => tl.fromTo(sel, { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.18, ease: 'none' }, at);
      const slideIn = (sel, at) => tl.fromTo(sel, { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.65, ease: IN }, at);
      const mon = (at, until) => {
        tl.fromTo('#s02-pmon', { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.5, ease: IN, immediateRender: false }, at - 0.1);
        tl.to('#s02-pmon', { opacity: 0, scale: 0.97, duration: 0.3, ease: OUT }, until - 0.35);
      };

      // carta
      tl.fromTo('#s02-card', { x: 140, y: -1000, rotationZ: -14, rotationY: 180 }, { x: 0, y: 0, rotationZ: -3, duration: 1.3, ease: IN }, T.card);
      tl.fromTo('#s02-card', { rotationY: 180 }, { rotationY: 0, duration: 1.1, ease: MOVE, immediateRender: false }, T.card + 1.0);
      tl.to('#s02-card', { x: -560, y: 40, scale: 0.62, rotationZ: -6, duration: 0.8, ease: MOVE }, T.scan - 0.3);

      // 1 · escáner 4 pasos
      blurIn('#s02-sc-t', T.scan + 0.1);
      tl.fromTo('#s02-phone', { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.7, ease: IN }, T.scan + 0.6);
      tl.fromTo('#s02-beam', { y: 0 }, { y: 280, duration: 2.2, ease: MOVE }, T.scan + 1.4);
      tl.to('#s02-beam', { y: 40, duration: 1.8, ease: MOVE }, T.scan + 3.8);
      show('#s02-sc-res', T.scan + 6.4, 0.3);
      ['#s02-s1', '#s02-s2', '#s02-s3', '#s02-s4'].forEach((s, i) => slideIn(s, T.scan + 1.2 + i * 2.0));
      blurIn('#s02-sc-k', T.scan + 10.4);
      out('#s02-scan > *', T.baz - 0.45);

      // 2 · puente bazar
      blurIn('#s02-b-t', T.baz + 0.1);
      slideIn('#s02-b-1', T.baz + 1.0);
      slideIn('#s02-b-2', T.baz + 2.2);
      out('#s02-baz > *', T.monA1 - 0.45);

      // monitores bazar (continuo a1 -> a2 sin bajar el marco)
      mon(T.monA1, T.qr);

      // 3 · puente QR
      blurIn('#s02-q-t', T.qr + 0.15);
      out('#s02-qr > *', T.monB - 0.45);
      mon(T.monB, T.map);

      // 4 · mapa del sistema
      blurIn('#s02-m-t', T.map + 0.1);
      tl.fromTo('#s02-n1', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: IN }, T.map + 0.7);
      show('#s02-a1', T.map + 1.2, 0.25);
      tl.fromTo('#s02-n2', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: IN }, T.map + 1.4);
      show('#s02-a2', T.map + 1.9, 0.25);
      tl.fromTo('#s02-n3', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: IN }, T.map + 2.1);
      tl.fromTo('#s02-pills .s02-pill', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.25, ease: IN }, T.map + 3.4);
      blurIn('#s02-m-k', T.map + 6.4);

      window.__timelines = window.__timelines || {};
      window.__timelines['s02'] = tl;
    })();
