        d.style.top = (row === 0 ? 290 : 410) + 'px';

      const IN = 'expo.out', MOVE = 'power2.inOut', OUT = 'power3.in';

      const mon = (at, until) => {
        tl.fromTo('#s06-mon', { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.5, ease: IN, immediateRender: false }, at - 0.1);
        tl.to('#s06-mon', { opacity: 0, scale: 0.97, duration: 0.3, ease: OUT }, until - 0.35);

      // carta

      tl.fromTo('#s06-card', { rotationY: 180 }, { rotationY: 0, duration: 1.1, ease: MOVE, immediateRender: false }, T.card + 1.0);
      tl.to('#s06-card', { x: -560, y: 40, scale: 0.62, rotationZ: -6, duration: 0.8, ease: MOVE }, T.diff - 0.3);

      // diferencia
      blurIn('#s06-d1', T.diff + 0.3); blurIn('#s06-d2', T.diff + 2.6);
      out('#s06-diff > *', T.aud - 0.4);

      // auditoría: el id pasa por el HMAC y sale el seudónimo
      slideIn('#s06-a-in', T.aud);
      tl.fromTo(['#s06-a-mac', '#s06-a-mac-t', '#s06-a-mac-k'], { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.6, ease: IN }, T.aud + 0.6);

      tl.fromTo('#s06-a-out', { opacity: 0, x: -200, scale: 0.7 }, { opacity: 1, x: 0, scale: 1, duration: 0.7, ease: IN }, T.aud + 2.4);
      tl.fromTo('#s06-ledger', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: IN }, T.aud + 3.8);
      show('#s06-r1', T.aud + 4.6); show('#s06-r2', T.aud + 5.1);
      tl.fromTo('#s06-r1 .mono', { color: '#2a2018' }, { color: '#8b0000', duration: 0.3 }, T.aud + 6.0);
      blurIn('#s06-a-note', T.aud + 6.8);
      out('#s06-aud > *', T.bid - 0.4);

      // subastas
      tl.fromTo('#s06-auc1', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: IN }, T.bid);
      tl.fromTo('#s06-auc2', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: IN }, T.bid + 0.3);
      blurIn('#s06-b-t', T.bid + 1.8); show('#s06-b-s', T.bid + 2.3, 0.3);
      out('#s06-bid > *', T.monA - 0.45);
      mon(T.monA, T.k);

      // k-anonimato: aparecen los puntos y la línea de k
      slideIn('#s06-k-cell', T.k);
      show('#s06-k .s06-lab:not(#s06-k-lab)', T.k + 0.6);
      tl.fromTo(dotEls, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.25, ease: 'back.out(1.3)', stagger: 0.12 }, T.k + 1.0);
      tl.fromTo('#s06-kline', { scaleY: 0, transformOrigin: 'center top' }, { scaleY: 1, duration: 0.5, ease: IN }, T.k + 3.0);
      show('#s06-k-lab', T.k + 3.3);
      blurIn('#s06-k-t', T.k + 4.4); show('#s06-k-s', T.k + 5.0, 0.3);
      out('#s06-k > *', T.copy - 0.4);

      // copia anonimizada
      slideIn('#s06-c-a', T.copy);
      tl.fromTo('#s06-c-b', { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.7, ease: IN }, T.copy + 1.2);
      show('#s06-c-l', T.copy + 2.2, 0.3);
      blurIn('#s06-c-t', T.copy + 3.2);
      out('#s06-copy > *', T.monB - 0.45);
      mon(T.monB, T.res);

      // revertir
      blurIn('#s06-res-t', T.res + 0.1); show('#s06-res-1', T.res + 0.8, 0.3);
      tl.fromTo('#s06-res-2', { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.7, ease: IN }, T.res + 1.6);
