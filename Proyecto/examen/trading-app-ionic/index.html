<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ionic App</title>
    
    <base href="/" />
    
    <!-- theme/variables.css's "Force Dark Mode / Medieval Mode Everywhere"
         block hardcodes every color unconditionally — there is no
         @media (prefers-color-scheme: light) branch anywhere, the app is
         ALWAYS dark. Declaring "light dark" here (the unmodified Ionic
         starter default) tells the browser/WebView both schemes are
         genuinely supported, which on Android invites the WebView's own
         algorithmic "force dark" pass on anything it doesn't recognize as
         already-dark — a CSS conic-gradient like SpinWheelModal's prize
         wheel is exactly that kind of custom-drawn content. Live-reported:
         the wheel's colors rendered inverted, and animating (rotating) that
         algorithmically-recolored layer crashed the app — a real, documented
         instability class in Chromium's forceDark + compositor path.
         Declaring "dark" only opts the page fully out of that pass. -->
    <meta name="color-scheme" content="dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <link rel="manifest" href="/manifest.json" />
    
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    
    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ionic App" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
